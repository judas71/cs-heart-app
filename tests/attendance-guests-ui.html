<!doctype html><html lang="ro"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Prezență — test sportivi suplimentari</title><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="../styles-v2.css"><link rel="stylesheet" href="../styles-attendance-compact.css"><p>TEST — date fictive, fără acces la baza clubului</p><div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script><script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script><script src="../src/no-training.js"></script><script src="../src/attendance-guests.js"></script>
<script>
function Test() { const [trainings, save] = React.useState([]); return React.createElement(window.AttendanceView, { athletes: [{id:'a',firstName:'ANA',lastName:'TEST',group:'A',active:true},{id:'b',firstName:'RADU',lastName:'ȘERBAN TEST',group:'B',active:true},{id:'c',firstName:'ION',lastName:'EXEMPLU',group:'B',active:true}], trainings, onSaveTraining: t => save(s => s.some(x=>x.id===t.id)?s.map(x=>x.id===t.id?t:x):[...s,t]), onDeleteTraining: t => save(s => s.filter(x => x.id !== t.id)) }); }

</script></html>
